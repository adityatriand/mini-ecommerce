global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mini-ecommerce'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Mini E-Commerce Application
  - job_name: 'mini-ecommerce-app'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          service: 'mini-ecommerce'
          environment: 'development'
    metrics_path: '/metrics'

  # PostgreSQL Exporter (optional - add if needed)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis Exporter (optional - add if needed)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
